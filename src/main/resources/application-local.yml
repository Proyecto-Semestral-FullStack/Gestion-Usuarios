        # ========== MySQL local (XAMPP) ==========
        spring:
          datasource:
            url: jdbc:mysql://localhost:3306/db_usuarios
            username: root
            password:
            driver-class-name: com.mysql.cj.jdbc.Driver
          jpa:
            database-platform: org.hibernate.dialect.MySQLDialect
            hibernate:
              ddl-auto: update
            properties:
              hibernate:
                format_sql: true